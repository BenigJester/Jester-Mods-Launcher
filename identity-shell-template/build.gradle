plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moodtools.identity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.moodtools.identity.template'
        minSdk 26
        targetSdk 35
        // IdentityShellManager replaces these compiled markers with the target game's version.
        // Shell protocol compatibility is tracked separately through manifest metadata.
        versionCode 2100000000
        versionName '__IDENTITY_GAME_VERSION__'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':Bcore')
}
