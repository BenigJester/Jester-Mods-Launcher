plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moodtools.identity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.moodtools.identity.template'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('launcherVersionCode').map { it.toInteger() }.getOrElse(1)
        versionName providers.gradleProperty('launcherVersionName').getOrElse('0.1.0') + '-identity-shell'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':Bcore')
}
