plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localSigningProperties = new Properties()
def localSigningPropertiesFile = rootProject.file('keystore.properties')
if (localSigningPropertiesFile.exists()) {
    localSigningPropertiesFile.withInputStream { localSigningProperties.load(it) }
}

def signingValue = { String name ->
    providers.gradleProperty(name).orNull ?: localSigningProperties.getProperty(name)
}

def debugSignerSha256 = 'ed994d5bc189fa7370f9d995fa427959254787c6055181cd68e79ce02b930cbb'
def trustedReleaseSignerSha256 = providers.gradleProperty('trustedReleaseSignerSha256').getOrElse('')
def releaseStorePath = signingValue('releaseStoreFile') ?: signingValue('storeFile')
def releaseStorePassword = signingValue('releaseStorePassword') ?: signingValue('storePassword')
def releaseKeyAlias = signingValue('releaseKeyAlias') ?: signingValue('keyAlias')
def releaseKeyPassword = signingValue('releaseKeyPassword') ?: signingValue('keyPassword')
def releaseSigningReady = releaseStorePath != null && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null

def privateModuleBundleValue = providers.gradleProperty('privateModuleBundle').orNull
def privateModuleScopeValue = providers.gradleProperty('privateModuleScope').orNull?.trim() ?: ''
def privateModuleBundle = privateModuleBundleValue
        ? rootProject.file(privateModuleBundleValue).canonicalFile
        : null
def privateModulePackage = ''
def privateModuleSha256 = ''
if (privateModuleBundle != null) {
    if (!privateModuleBundle.isFile()) {
        throw new GradleException("privateModuleBundle does not exist: ${privateModuleBundle}")
    }
    if (!(privateModuleScopeValue ==~ /[a-z0-9][a-z0-9._-]{2,63}/)) {
        throw new GradleException(
            'A private module build requires -PprivateModuleScope=<3-64 lowercase letters, digits, dots, underscores, or hyphens>.'
        )
    }
    def archive = new java.util.zip.ZipFile(privateModuleBundle)
    try {
        def configEntry = archive.getEntry('config.json')
        if (configEntry == null || configEntry.directory || configEntry.size < 2 || configEntry.size > 65_536) {
            throw new GradleException('The private module bundle must contain a small config.json file.')
        }
        def configText = archive.getInputStream(configEntry).getText('UTF-8')
        if (configText.startsWith('\uFEFF')) configText = configText.substring(1)
        def config = new groovy.json.JsonSlurper().parseText(configText)
        privateModulePackage = String.valueOf(config.package_name ?: config.target_package ?: '')
        if (!(privateModulePackage ==~ /[A-Za-z0-9_.]{3,200}/)) {
            throw new GradleException('The private module bundle contains an invalid package name.')
        }
        ['classes.dex', 'libmenu_native.so'].each { requiredName ->
            def required = archive.getEntry(requiredName)
            if (required == null || required.directory || required.size <= 0) {
                throw new GradleException("The private module bundle is missing ${requiredName}.")
            }
        }
    } finally {
        archive.close()
    }
    privateModuleSha256 = java.security.MessageDigest.getInstance('SHA-256')
        .digest(privateModuleBundle.bytes)
        .collect { String.format('%02x', it & 0xFF) }
        .join()
}

def generatedPrivateModuleAssets = layout.buildDirectory.dir('generated/privateModuleAssets')
def generatedPrivateModuleAssetsDirectory = file("$buildDir/generated/privateModuleAssets")
def generatedIdentityShellAssetsDirectory = file("$buildDir/generated/identityShellTemplateAssets")
def preparePrivateModuleAssets = tasks.register('preparePrivateModuleAssets') {
    outputs.dir(generatedPrivateModuleAssets)
    if (privateModuleBundle != null) inputs.file(privateModuleBundle)
    doLast {
        def outputRoot = generatedPrivateModuleAssets.get().asFile
        project.delete(outputRoot)
        if (privateModuleBundle != null) {
            def outputDirectory = new File(outputRoot, 'embedded-private')
            if (!outputDirectory.mkdirs() && !outputDirectory.isDirectory()) {
                throw new GradleException('Could not create generated private module assets.')
            }
            project.copy {
                from privateModuleBundle
                into outputDirectory
                rename { 'module.zip' }
            }
        }
    }
}

def releaseSignerSha256 = {
    def keyStore = java.security.KeyStore.getInstance('JKS')
    rootProject.file(releaseStorePath).withInputStream { input ->
        keyStore.load(input, releaseStorePassword.toCharArray())
    }
    def certificate = keyStore.getCertificate(releaseKeyAlias)
    if (certificate == null) {
        throw new GradleException("Release key alias '${releaseKeyAlias}' was not found in the configured keystore.")
    }
    java.security.MessageDigest.getInstance('SHA-256')
        .digest(certificate.encoded)
        .collect { String.format('%02X', it & 0xFF) }
        .join()
}

gradle.taskGraph.whenReady { graph ->
    def productionPackageRequested = graph.allTasks.any { task ->
        task.project == project(':app') && task.name.matches('(?i).*(assemble|bundle|package|install).*Release.*')
    }
    if (productionPackageRequested &&
            (!releaseSigningReady || !trustedReleaseSignerSha256.matches('[0-9A-Fa-f]{64}'))) {
        throw new GradleException(
            'Production release packaging requires releaseStoreFile, releaseStorePassword, ' +
                'releaseKeyAlias, releaseKeyPassword, and the matching trustedReleaseSignerSha256.'
        )
    }
    if (productionPackageRequested &&
            !releaseSignerSha256().equalsIgnoreCase(trustedReleaseSignerSha256)) {
        throw new GradleException(
            'The configured release keystore does not match trustedReleaseSignerSha256. ' +
                'Refusing to create an unusable launcher release.'
        )
    }
}

android {
    namespace 'com.moodtools.hub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.moodtools'
        manifestPlaceholders = [launcherLabel: 'Jester Mods']
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('launcherVersionCode').map { it.toInteger() }.getOrElse(117)
        versionName providers.gradleProperty('launcherVersionName').getOrElse('1.1.7')
        buildConfigField 'String', 'UPDATE_PUBLIC_KEY_DER_BASE64', '""'
        buildConfigField 'String', 'ACCESS_LEASE_PUBLIC_KEY_DER_BASE64', '""'
        buildConfigField 'boolean', 'PRIVATE_MODULE_ENABLED', privateModuleBundle != null ? 'true' : 'false'
        buildConfigField 'String', 'PRIVATE_MODULE_PACKAGE', '"' + privateModulePackage + '"'
        buildConfigField 'String', 'PRIVATE_MODULE_SCOPE', '"' + privateModuleScopeValue + '"'
        buildConfigField 'String', 'PRIVATE_MODULE_SHA256', '"' + privateModuleSha256 + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }

    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    flavorDimensions += 'executionMode'

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile rootProject.file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    productFlavors {
        root {
            dimension 'executionMode'
            applicationIdSuffix '.hub.root'
            buildConfigField 'boolean', 'IS_ROOT_MODE', 'true'
            ndk {
                abiFilters 'arm64-v8a'
            }
            externalNativeBuild {
                cmake {
                    cppFlags '-DEXECUTION_MODE_ROOT=1'
                }
            }
        }

        nonroot {
            dimension 'executionMode'
            applicationId 'com.moodtools.hub.nonroot'
            buildConfigField 'boolean', 'IS_ROOT_MODE', 'false'
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            externalNativeBuild {
                cmake {
                    cppFlags '-DEXECUTION_MODE_NONROOT=1'
                }
            }
        }
    }

    buildTypes {
        debug {
            // Keep local/device-test builds beside the production launcher instead of
            // replacing its package, data, and signing identity during adb install -r.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [launcherLabel: 'Jester Mods Debug']
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField 'boolean', 'RUNTIME_SECURITY_ENFORCED', 'false'
            buildConfigField 'String', 'TRUSTED_SIGNER_SHA256', '"' + debugSignerSha256 + '"'
            buildConfigField 'String', 'SECURITY_BUILD_CHANNEL', '"debug"'
        }

        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'boolean', 'RUNTIME_SECURITY_ENFORCED', 'true'
            buildConfigField 'String', 'TRUSTED_SIGNER_SHA256', '"' + trustedReleaseSignerSha256 + '"'
            buildConfigField 'String', 'SECURITY_BUILD_CHANNEL', '"release"'
            if (releaseSigningReady) signingConfig signingConfigs.release
        }

        hardenedTest {
            initWith release
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'RUNTIME_SECURITY_ENFORCED', 'true'
            buildConfigField 'String', 'TRUSTED_SIGNER_SHA256', '"' + debugSignerSha256 + '"'
            buildConfigField 'String', 'SECURITY_BUILD_CHANNEL', '"release"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    sourceSets {
        main.assets.srcDir(generatedPrivateModuleAssetsDirectory)
        nonroot.assets.srcDir(new File(generatedIdentityShellAssetsDirectory, 'nonroot'))
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Every non-root variant embeds the same release-grade template. A single producer avoids
// cross-variant output races and makes debug unit tests inspect the minified production shell.
def prepareIdentityShellAsset = tasks.register('prepareIdentityShellAsset', Sync) {
    dependsOn(':identity-shell-template:assembleRelease')
    from(project(':identity-shell-template').layout.buildDirectory.dir('outputs/apk/release')) {
        include('*.apk')
        rename { 'template.apk' }
    }
    into(new File(generatedIdentityShellAssetsDirectory, 'nonroot/identity-shell'))
}

tasks.configureEach { task ->
    if ((task.name.startsWith('merge') && task.name.endsWith('Assets')) ||
            task.name.toLowerCase(java.util.Locale.ROOT).contains('lint')) {
        task.dependsOn(preparePrivateModuleAssets)
    }
    if ((task.name.startsWith('mergeNonroot') && task.name.endsWith('Assets')) ||
            (task.name.toLowerCase(java.util.Locale.ROOT).contains('lint') &&
                task.name.toLowerCase(java.util.Locale.ROOT).contains('nonroot')) ||
            task.name == 'testNonrootDebugUnitTest') {
        task.dependsOn(prepareIdentityShellAsset)
        if (task.name == 'testNonrootDebugUnitTest') {
            task.inputs.file(new File(
                generatedIdentityShellAssetsDirectory,
                'nonroot/identity-shell/template.apk'
            ))
        }
    }
}

dependencies {
    nonrootImplementation project(':Bcore')
    // Direct-patch modules preserve existing split contents/alignment while replacing the
    // Play signature as one launcher-signed APK cluster.
    nonrootImplementation 'com.android.tools.build:apksig:9.0.1'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.03')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
