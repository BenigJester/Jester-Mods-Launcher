name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run unit test suite'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android Client
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK & NDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Root & Non-root Debug APKs
        run: ./gradlew :app:assembleRootDebug :app:assembleNonrootDebug --stacktrace

      - name: Run Unit Tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: ./gradlew :app:testRootDebugUnitTest :app:testNonrootDebugUnitTest --stacktrace

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jester-mods-launcher-debug-apks
          path: |
            app/build/outputs/apk/root/debug/*.apk
            app/build/outputs/apk/nonroot/debug/*.apk
          retention-days: 14

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
