name = "jester-mods-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# KV Database for digital keys, device bindings, and ephemeral nonces
# Run: npx wrangler kv:namespace create LAUNCHER_KV
# Then paste the id below:
# [[kv_namespaces]]
# binding = "LAUNCHER_KV"
# id = "your_kv_namespace_id"

# R2 Bucket for storing module ZIP files (classes.dex, libmenu_native.so, etc.)
# Run: npx wrangler r2 bucket create launcher-modules
# [[r2_buckets]]
# binding = "PAYLOAD_BUCKET"
# bucket_name = "launcher-modules"
