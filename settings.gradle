pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'Standalone Menu'
include ':app'
include ':identity-shell-template'
include ':black-reflection', ':compiler', ':Bcore'

project(':black-reflection').projectDir = file('third_party/BlackBox/black-reflection')
project(':compiler').projectDir = file('third_party/BlackBox/compiler')
project(':Bcore').projectDir = file('third_party/BlackBox/Bcore')
